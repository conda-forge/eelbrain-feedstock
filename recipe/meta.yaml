{% set name = "eelbrain" %}
{% set version = "0.43.0a3" %}
{% set sha256 = "60a8a37575ea578dc741d68700909f364b7ecd505a6056b1c3ad3c71df1a9637" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  skip: true  # [py < 312]
  osx_is_app: true
  script: {{ PYTHON }} -m pip install . -vv

# Pin numpy major version because cythonize is sensitive to it
requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy >=2                              # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - setuptools >=17
  host:
    - libblas
    - libcblas
    - llvm-openmp  # [osx and x86_64]
    - python
    - python.app  # [osx]
    - packaging
    - pip
    - setuptools >=70.1.0
    - setuptools_scm >=6.2  # Required for embedding version
    - cython >=3
    - numpy >=2
  run:
    - python
    - python.app  # [osx]
    - llvm-openmp  # [osx and x86_64]
    - appnope >=0.1.3  # [osx]
    - colormath >=2.1
    - imageio
    - ipython
    - keyring >=5
    - libclang
    - matplotlib-base >=3.6
    - mayavi >=4.6.2
    - mne-base >=1.6
    - mne-bids
    - nibabel >=2.5
    - nilearn
    - numpy >=2
    - pymatreader
    - pillow
    - psutil
    - pyface !=7.2.0  # broken for wx
    - pyparsing >=3
    - pysurfer >=0.11.2
    - packaging
    - scipy >=1.5
    - seaborn
    - tqdm >=4.40
    - wxpython >=4.0.3,!=4.1.0

test:
  commands:
    - python -c "from importlib.metadata import version; import eelbrain; assert version('eelbrain') == '{{ version }}'; assert eelbrain.__version__ == '{{ version }}'"
  imports:
    - eelbrain
    - eelbrain.load
    - eelbrain.mne_fixes
    - eelbrain.plot
    - eelbrain.save

about:
  home: http://eelbrain.readthedocs.io
  summary: MEG/EEG analysis tools
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  doc_url: http://eelbrain.readthedocs.io/
  dev_url: https://github.com/christianbrodbeck/eelbrain

extra:
  recipe-maintainers:
    - christianbrodbeck
